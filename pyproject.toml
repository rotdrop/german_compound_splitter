[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "german_compound_splitter"
version = "0.1.5"
description = "Compound splitter for German language based on the Aho-Corasick algorithm"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "CC-BY-4.0" }
authors = [
    { name = "repodiac", email = "spamornot@gmx.net" },
]
dependencies = [
    "pyahocorasick",
]

[project.urls]
Homepage = "https://github.com/repodiac/german_compound_splitter"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
