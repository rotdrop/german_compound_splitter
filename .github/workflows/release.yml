name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Determine version and release type
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog entry
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found"; exit 1
          fi
          # Expects headings like "## [1.2.3] - date" or "## 1.2.3"
          awk -v v="$VERSION" '
            /^## / {
              if (found) exit
              h = $0
              sub(/^## +\[?/, "", h)
              split(h, a, /[] ]/)
              if (a[1] == v) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no (non-empty) entry for ${VERSION}"; exit 1
          fi

      - name: Check version matches pyproject.toml
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python -m pip install packaging
          python - <<'EOF'
          import os, sys, tomllib
          from packaging.version import Version
          tag = os.environ["VERSION"]
          actual = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          # PEP 440 equality: "1.2.3-rc1" == "1.2.3rc1"
          if Version(actual) != Version(tag):
              sys.exit(f"::error::pyproject.toml version {actual} != tag version {tag}")
          EOF

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag "${flags[@]}"
